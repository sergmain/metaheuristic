mh.testing=true

# Disable file logging in tests to prevent @TempDir cleanup failures on Windows
# (Logback holds file handles that block temp directory deletion)
logging.file.name=

#spring.jpa.show-sql = true
#logging.level.org.hibernate.SQL = debug

# ---------------------------------------------------------------------------------------------
# TEST-ONLY licence verification key (EC P-256 public half). Trusted ONLY under the mh-test-lm profile.
#
# ! There is NO private key here and there must never be one. The licence in
#   src/test/resources/license/mh-test-license.jws was signed ONCE by apps/license-signer with
#   `sign <recipe> --mint-key`, and the private half was destroyed afterwards. Verification needs
#   only the public half, so nothing in this repository can forge a licence.
#
# ! This file lives in src/test/resources and is NEVER packaged, and the ONLY class that reads this
#   property lives in src/test/java. No class under src/main reads a licence key from configuration
#   and none ever may: the production verification key is a compiled-in constant precisely so a
#   customer cannot swap it, and Spring does not care whether a value arrives from a properties
#   file, a command-line argument or an environment variable.
#
# ! NEVER add this public key to LicenseVerificationKeys. It is trusted only under the test
#   profile; trusting it in a shipped build would make the checked-in licence valid in production.
#
# The licence is long-dated (exp 2099) BECAUSE the signing key is gone - it can never be re-signed.
# That costs nothing: it verifies only under this key, which only the test profile trusts, so a
# leaked test licence is worthless against a real build whatever its exp says.
# ---------------------------------------------------------------------------------------------
mh.test-license.public-key=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEZaw8S5ShZnKKULmd7iQdlNB4JlyiDn5P+Eo7EKW8U/2yOs1y0acoTGrGiRApKgDYK37iVRgpYI0thPekSrbBjg==
