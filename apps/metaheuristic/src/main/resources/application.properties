# ------------- execution-gate analyzers (dispatcher-level, apply to every Function) -------------
# A Dispatcher restart LOCKS every company's Vault, and a Processor fetching a sealed secret against a
# locked Vault gets the same 410/GONE as a genuinely missing key: "812.040 / 812.041 Vault has no entry".
# Retrying helps neither - a locked Vault clears only on a human unlock, a missing key only when added - so
# the retry must be FREE (increment-tries=false). api scope withholds exactly the Functions needing that
# (companyId, keyCode) until the block lifts; 2min so the free-retry re-probes soon after an unlock.
# The (01\.)? prefix is forward-compatible with RULE-ERROR-CODE-SCHEME: DownloadSealedSecretService still
# emits the legacy 812.04x, and this matches it now AND the migrated 01.812.04x whenever that class is next
# edited for another reason. VaultMissingErrorCodeSyncTest keeps this regex and that emission site in lockstep.
mh.dispatcher.execution-gate.analyzers[0].name = vault is locked
mh.dispatcher.execution-gate.analyzers[0].regex[0] = (01\\.)?812\\.04[23] Vault is locked
mh.dispatcher.execution-gate.analyzers[0].timeout = 2min
mh.dispatcher.execution-gate.analyzers[0].increment-tries = false
mh.dispatcher.execution-gate.analyzers[0].scope = api

# SPLIT: the rule above used to cover both cases and gave both the free retry. It is right for a LOCK
# and wrong for a MISSING ENTRY - the Task then never spends a try, never reaches ERROR, and nobody is
# told. Seen on ExecContext #294: 1062 rejections across all 15 buckets against an UNLOCKED Vault that
# simply has no such key. SealedSecretService now answers 423 for a lock and 410 for an absent entry,
# so the two are separable here. Same reasoning the call-cc Function applies to api-credentials-rejected.
mh.dispatcher.execution-gate.analyzers[1].name = vault has no entry for this key
mh.dispatcher.execution-gate.analyzers[1].regex[0] = (01\\.)?812\\.04[01] Vault has no entry
mh.dispatcher.execution-gate.analyzers[1].timeout = 10min
mh.dispatcher.execution-gate.analyzers[1].increment-tries = true
mh.dispatcher.execution-gate.analyzers[1].scope = api

